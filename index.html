<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Lance's live now-playing display." />
    <title>Listening</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Listening</h1>
        <p>A small now-playing project.</p>
      </header>

      <section class="now-playing" aria-live="polite">
        <p class="status" id="status">Loading...</p>
        <h2 id="title">Checking Last.fm</h2>
        <p id="artist"></p>
        <p id="album"></p>
        <p class="timestamp" id="timestamp"></p>
        <a id="track-link" href="#" target="_blank" rel="noreferrer">View on Last.fm</a>
      </section>

      <nav aria-label="Project endpoints">
        <a href="/api/now-playing">JSON endpoint</a>
        <a href="/now.svg">SVG status card</a>
      </nav>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
